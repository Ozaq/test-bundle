build:
  parallel: 64
  modules:
    - ninja
    - netcdf4
    - aec
    - eigen
  dependencies:
    - ecmwf/ecbuild@develop
  cmake_options:
    - -DECMWF_HPC_NIGHTLY=1
  env:
    - INPUT_GITHUB_TOKEN=${GITHUB_TOKEN}
  sync_module: true
  module_name: mars
  install_type: module
  site: aa-batch
  prefix_compiler_specific: true
  queue: deploy
  # For nightly deployments
  install_prefix: /usr/local/apps/mars/versions/nightly
